,"level":2,"text":"Что врач делает при выводе из запоя в Андреевке"},{"order":8,"level":2,"text":"Лицензии и разрешительная документация"},{"order":9,"level":2,"text":"Работаем по клиническим рекомендациям Минздрава РФ"},{"order":10,"level":2,"text":"Как работает наша выездная служба"},{"order":11,"level":2,"text":"Кейсы выездной службы"},{"order":12,"level":2,"text":"Часто задаваемые вопросы"}]},{"url":"https://profilactica.clinic/uslugi/vyzov-narkologa-na-dom-v-yahrome/","pageType":"GEO — Нарколог на дом","filterKey":"geo:Нарколог на дом","filterLabel":"GEO · Нарколог на дом","isGeo":true,"geoService":"Нарколог на дом","status":200,"headings":[{"order":1,"level":1,"text":"Вызов нарколога на дом в Яхроме"},{"order":2,"level":2,"text":"Стоимость вызова нарколога на дом в Яхроме"},{"order":3,"level":2,"text":"Оплата и документы"},{"order":4,"level":2,"text":"Отзывы пациентов нашей клиники"},{"order":5,"level":2,"text":"Что отличает нашу клинику"},{"order":6,"level":2,"text":"Как вызвать нарколога на дом в Яхроме"},{"order":7,"level":2,"text":"Что может сделать нарколог на дому в Яхроме"},{"order":8,"level":2,"text":"Лицензии и разрешительная документация"},{"order":9,"level":2,"text":"Работаем по клиническим рекомендациям Минздрава РФ"},{"order":10,"level":2,"text":"Как работает наша выездная служба"},{"order":11,"level":2,"text":"Кейсы выездной службы"},{"order":12,"level":2,"text":"Часто задаваемые вопросы"}]}]</script>
  <script>
    const pages = JSON.parse(document.getElementById('page-data').textContent);
    const pageList = document.getElementById('page-list');
    const typeFilter = document.getElementById('type-filter');
    const levelFilter = document.getElementById('level-filter');
    const searchInput = document.getElementById('search');
    const numberFormat = new Intl.NumberFormat('ru-RU');

    function escapeHtml(value) {
      const map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
      return String(value == null ? '' : value).replace(/[&<>"']/g, function(char) { return map[char]; });
    }
    function pluralRu(number, one, few, many) {
      const lastTwo = number % 100;
      const last = number % 10;
      if (last === 1 && lastTwo !== 11) return one;
      if (last >= 2 && last <= 4 && (lastTwo < 12 || lastTwo > 14)) return few;
      return many;
    }
    function countsText(headings) {
      const counts = [1,2,3,4,5,6].map(function(level) {
        const count = headings.filter(function(heading) { return heading.level === level; }).length;
        return count ? 'H' + level + ' ' + numberFormat.format(count) : '';
      }).filter(Boolean);
      return numberFormat.format(headings.length) + ' ' + pluralRu(headings.length, 'заголовок', 'заголовка', 'заголовков') + (counts.length ? ' · ' + counts.join(' · ') : '');
    }
    function createCard(page, index) {
      const h1 = page.headings.find(function(heading) { return heading.level === 1; });
      const label = escapeHtml(page.filterLabel);
      const countLabel = escapeHtml(countsText(page.headings));
      const outline = page.headings.map(function(heading) {
        return '<li class="heading-row" data-level="' + heading.level + '" data-text="' + escapeHtml(heading.text.toLocaleLowerCase('ru-RU')) + '" style="--level:' + heading.level + '">' +
          '<span class="order">' + heading.order + '</span>' +
          '<span class="level-tag">H' + heading.level + '</span>' +
          '<span class="heading-text">' + escapeHtml(heading.text) + '</span>' +
        '</li>';
      }).join('');
      return '<article class="page-card" data-index="' + index + '" data-filter="' + escapeHtml(page.filterKey) + '">' +
        '<div class="card-top">' +
          '<div class="card-labels"><span class="type-label">' + label + '</span><span class="counts">' + countLabel + '</span></div>' +
          '<button class="toggle" type="button" aria-expanded="false">Показать структуру</button>' +
          '<a class="page-url" href="' + escapeHtml(page.url) + '" target="_blank" rel="noreferrer">' + escapeHtml(page.url) + '</a>' +
          '<p class="page-h1"><span class="level-tag">H1</span><span>' + escapeHtml(h1 ? h1.text : '—') + '</span></p>' +
        '</div>' +
        '<div class="outline" hidden><ol class="heading-list">' + outline + '</ol></div>' +
      '</article>';
    }

    document.getElementById('total-pages').textContent = numberFormat.format(pages.length) + ' ' + pluralRu(pages.length, 'URL', 'URL', 'URL');
    document.getElementById('total-headings').textContent = numberFormat.format(pages.reduce(function(sum, page) { return sum + page.headings.length; }, 0)) + ' заголовков';
    document.getElementById('total-geo').textContent = pages.filter(function(page) { return page.isGeo; }).length + ' GEO-услуг · по одному URL';

    const options = new Map();
    pages.forEach(function(page) { options.set(page.filterKey, page.filterLabel); });
    Array.from(options.entries()).sort(function(a, b) { return a[1].localeCompare(b[1], 'ru'); }).forEach(function(entry) {
      typeFilter.add(new Option(entry[1], entry[0]));
    });
    pageList.innerHTML = pages.map(createCard).join('');
    const cards = Array.from(pageList.querySelectorAll('.page-card'));

    function applyFilters() {
      const typeValue = typeFilter.value;
      const levelValue = levelFilter.value;
      const query = searchInput.value.trim().toLocaleLowerCase('ru-RU');
      let visible = 0;
      cards.forEach(function(card) {
        const page = pages[Number(card.dataset.index)];
        const matchingHeadings = page.headings.filter(function(heading) {
          return levelValue === 'all' || String(heading.level) === levelValue;
        });
        const typeMatches = typeValue === 'all' || card.dataset.filter === typeValue;
        const levelMatches = levelValue === 'all' || matchingHeadings.length > 0;
        const searchText = (page.url + ' ' + page.filterLabel + ' ' + matchingHeadings.map(function(heading) { return heading.text; }).join(' ')).toLocaleLowerCase('ru-RU');
        const searchMatches = !query || searchText.includes(query);
        const show = typeMatches && levelMatches && searchMatches;
        card.hidden = !show;
        if (show) visible++;
        card.querySelectorAll('.heading-row').forEach(function(row) {
          row.hidden = levelValue !== 'all' && row.dataset.level !== levelValue;
        });
      });
      document.getElementById('result-count').textContent = 'Показано ' + numberFormat.format(visible) + ' из ' + numberFormat.format(pages.length) + ' страниц';
      document.getElementById('empty').hidden = visible > 0;
    }
    function setCardOpen(card, isOpen) {
      const outline = card.querySelector('.outline');
      const button = card.querySelector('.toggle');
      outline.hidden = !isOpen;
      button.setAttribute('aria-expanded', String(isOpen));
      button.textContent = isOpen ? 'Скрыть структуру' : 'Показать структуру';
    }
    cards.forEach(function(card) {
      card.querySelector('.toggle').addEventListener('click', function() {
        setCardOpen(card, card.querySelector('.outline').hidden);
      });
    });
    typeFilter.addEventListener('change', applyFilters);
    levelFilter.addEventListener('change', applyFilters);
    searchInput.addEventListener('input', applyFilters);
    document.getElementById('expand-all').addEventListener('click', function() {
      cards.filter(function(card) { return !card.hidden; }).forEach(function(card) { setCardOpen(card, true); });
    });
    document.getElementById('collapse-all').addEventListener('click', function() {
      cards.filter(function(card) { return !card.hidden; }).forEach(function(card) { setCardOpen(card, false); });
    });
    document.getElementById('reset').addEventListener('click', function() {
      searchInput.value = '';
      typeFilter.value = 'all';
      levelFilter.value = 'all';
      applyFilters();
    });
    applyFilters();
  </script>
